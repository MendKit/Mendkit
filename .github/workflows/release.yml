# Builds MendKit for Windows, macOS and Linux and publishes it to the Cloudflare R2 release bucket.
#
# From the Actions tab: "Build and publish" > Run workflow.
#   version    New version number, for example 0.18.0. Leave empty to build the version in package.json.
#   publish    Upload to the bucket. Untick to only build (the files stay on the run page).
#   overwrite  Allow publishing a version the bucket already has.
#
# Publishing uploads the installers first and the "latest" files last, so installed copies never
# see a new version before its files are there. When a new version number was given, package.json
# is updated on main and the commit is tagged v<version>.
name: Build and publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version number (for example 0.18.0). Empty = keep the one in package.json"
        required: false
        default: ""
      publish:
        description: "Upload to the release bucket"
        type: boolean
        default: true
      overwrite:
        description: "Allow replacing a version that is already published"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Work out the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          current=$(node -p "require('./package.json').version")
          v="${INPUT_VERSION:-$current}"
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$v' is not a version number like 0.18.0"; exit 1
          fi
          echo "Building MendKit $v (package.json has $current)"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Tools for building .rpm packages
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - name: Set the version
        shell: bash
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm test
        if: matrix.os == 'ubuntu-latest'
      # Code signing switches on by itself when the repository secrets exist (see docs/SIGNING.md):
      # CSC_LINK/CSC_KEY_PASSWORD (Mac Developer ID), WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD (Windows),
      # APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID (notarization). Missing ones are left out.
      - name: Set up code signing
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            echo "CSC_LINK=$CSC_LINK_SECRET" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            # Mac: with an Apple ID app password and team, the app is also notarized, so it opens with no warning.
            if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_ID_SECRET" ]; then
              echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_PASSWORD_SECRET" >> "$GITHUB_ENV"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_SECRET" >> "$GITHUB_ENV"
              echo "EXTRA_BUILD_ARGS=-c.mac.notarize=true" >> "$GITHUB_ENV"
            fi
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            # Without a certificate the Mac app is signed ad hoc: Apple-silicon Macs call a
            # completely unsigned app "damaged" and refuse to open it.
            if [ "$RUNNER_OS" = "macOS" ]; then echo "EXTRA_BUILD_ARGS=-c.mac.identity=-" >> "$GITHUB_ENV"; fi
          fi
      - run: npm run ${{ matrix.script }} -- $EXTRA_BUILD_ARGS
        shell: bash
      - name: Check the Mac app signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(ls -d release/mac*/MendKit.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|flags|Identifier"
      - uses: actions/upload-artifact@v6
        with:
          name: MendKit-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.tar.gz
            release/*.deb
            release/*.rpm
            release/*.yml
            release/*.blockmap
            !release/builder-debug.yml
            !release/builder-effective-config.yaml

  publish:
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      OVERWRITE: ${{ inputs.overwrite }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # Newer AWS CLI versions add checksums R2 does not need; send them only when required.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - name: Upload to the release bucket
        run: bash .github/scripts/publish-r2.sh out
      # apt and dnf/zypper repositories, so Linux updates arrive through the normal software updater.
      # Switched on by the LINUX_REPO_GPG_KEY secret (see docs/LINUX-REPOS.md).
      - name: Linux package repositories
        env:
          LINUX_REPO_GPG_KEY: ${{ secrets.LINUX_REPO_GPG_KEY }}
          LINUX_REPO_GPG_PASSPHRASE: ${{ secrets.LINUX_REPO_GPG_PASSPHRASE }}
          REPO_URL: https://pub-a4ba3af629e94c87a8e9aec1b8e48df7.r2.dev
        run: |
          if [ -z "$LINUX_REPO_GPG_KEY" ]; then echo "No LINUX_REPO_GPG_KEY secret: skipping the repositories."; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils createrepo-c rpm
          mkdir pkgs && cp out/MendKit-$VERSION-amd64.deb out/MendKit-$VERSION-x86_64.rpm pkgs/
          bash .github/scripts/build-linux-repos.sh pkgs repos
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp repos/mendkit.gpg "s3://$R2_BUCKET/mendkit.gpg" --endpoint-url "$endpoint" --only-show-errors
          aws s3 cp repos/mendkit.asc "s3://$R2_BUCKET/mendkit.asc" --endpoint-url "$endpoint" --only-show-errors
          # Packages first, then the signed indexes, so a client never sees an index for a missing file.
          aws s3 sync repos/apt/pool "s3://$R2_BUCKET/apt/pool" --endpoint-url "$endpoint" --only-show-errors
          aws s3 cp repos/rpm "s3://$R2_BUCKET/rpm" --recursive --exclude "repodata/*" --endpoint-url "$endpoint" --only-show-errors
          aws s3 sync repos/rpm/repodata "s3://$R2_BUCKET/rpm/repodata" --delete --endpoint-url "$endpoint" --only-show-errors --cache-control "no-cache, max-age=0"
          aws s3 sync repos/apt/dists "s3://$R2_BUCKET/apt/dists" --endpoint-url "$endpoint" --only-show-errors --cache-control "no-cache, max-age=0"
          echo "Repositories published."

      - name: Record the version on main
        if: inputs.version != ''
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          if git diff --quiet; then echo "package.json already has $VERSION"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
