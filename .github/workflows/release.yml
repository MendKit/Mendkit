# Builds installers for Windows, macOS and Linux and attaches them to the run.
# Start it from the Actions tab ("Run workflow"), or push a tag like v0.16.0.
name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
        if: matrix.os == 'ubuntu-latest'
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          # Code signing: add these as repository secrets once you have certificates. Unset, the builds are unsigned.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: MendKit-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.tar.gz
