name: Linux distributions
# Runs MendKit's Linux checks inside real distributions: shell syntax with each one's own /bin/sh,
# package manager detection, and the read-only commands. Runs on every change to the definitions or engine.
on:
  push:
    paths: ['definitions/**', 'src/**', '.github/workflows/linux-distros.yml', '.github/scripts/*linux-repos.sh']
  pull_request:
    paths: ['definitions/**', 'src/**']
  workflow_dispatch:

jobs:
  distro:
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'ubuntu:22.04', 'debian:stable', 'linuxmintd/mint22-amd64', 'fedora:latest', 'archlinux:latest', 'opensuse/tumbleweed']
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Basic tools
        shell: sh
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates xz-utils pciutils procps git >/dev/null
          elif command -v dnf >/dev/null; then dnf install -y -q curl xz pciutils procps-ng git tar
          elif command -v pacman >/dev/null; then pacman -Syu --noconfirm --needed curl xz pciutils procps-ng git tar
          elif command -v zypper >/dev/null; then zypper --non-interactive install --no-recommends curl xz tar gzip; fi
      - uses: actions/checkout@v5
      - name: Node.js
        shell: sh
        run: |
          curl -fsSL https://nodejs.org/dist/v22.12.0/node-v22.12.0-linux-x64.tar.xz | tar -xJ -C /opt
          for b in node npm npx; do ln -sf /opt/node-v22.12.0-linux-x64/bin/$b /usr/local/bin/$b; done
      - name: Build
        shell: sh
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --ignore-scripts && npx tsc -p tsconfig.json
      - name: Check MendKit's Linux commands on this distribution
        shell: sh
        run: node dist/scripts/distro-check.js

  # The apt and dnf/zypper repositories: build them from test packages with a throwaway key, then install
  # through each distribution's own package manager with signature checks on.
  repo-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils createrepo-c rpm
      - run: bash .github/scripts/test-linux-repos.sh
      - uses: actions/upload-artifact@v6
        with:
          name: repo-test
          path: repo-test/out

  repo-install:
    needs: repo-build
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:stable', 'ubuntu:24.04', 'fedora:latest']
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: repo-test
          path: /repo
      - name: Install MendKit from the repository
        shell: bash
        run: |
          set -e
          if command -v apt-get >/dev/null; then
            cp /repo/mendkit.gpg /usr/share/keyrings/mendkit.gpg
            echo "deb [signed-by=/usr/share/keyrings/mendkit.gpg] file:///repo/apt stable main" > /etc/apt/sources.list.d/mendkit.list
            apt-get update
            apt-get install -y mendkit
            dpkg -s mendkit | grep -q '^Version: 0.0.1'
          else
            cp /repo/rpm/mendkit.repo /etc/yum.repos.d/mendkit.repo
            cat /etc/yum.repos.d/mendkit.repo
            dnf install -y mendkit
            rpm -q mendkit
          fi
          test -f /usr/share/mendkit/test && echo "Installed from the signed repository"
