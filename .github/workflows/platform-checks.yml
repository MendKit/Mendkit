name: Windows and Mac checks
# Runs MendKit's own commands on real Windows and macOS machines: every PowerShell script is parsed by
# PowerShell, every Mac shell script by the Mac's /bin/sh, and the read-only commands run for real.
on:
  push:
    paths: ['definitions/**', 'src/**', '.github/workflows/platform-checks.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx tsc -p tsconfig.json
      - run: node dist/scripts/windows-check.js
      - name: Install PhotoRec the way MendKit does (winget), or from its zip if winget is missing
        shell: pwsh
        run: |
          winget install --id CGSecurity.TestDisk -e --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            Invoke-WebRequest https://www.cgsecurity.org/testdisk-7.2.win64.zip -OutFile td.zip
            Expand-Archive td.zip -DestinationPath C:\td
            "MENDKIT_PHOTOREC_DIR=$((Get-ChildItem C:\td -Directory | Select-Object -First 1).FullName)" >> $env:GITHUB_ENV
          }
      - run: node dist/scripts/recover-check.js
      - name: The installed app can run its PowerShell scripts (they must sit outside the app archive)
        shell: pwsh
        run: |
          npx electron-builder --win dir --publish never
          $s = Get-ChildItem release -Recurse -Filter windows-startup.ps1 | Where-Object { $_.FullName -match 'app\.asar\.unpacked' } | Select-Object -First 1
          if (-not $s) { throw 'definitions/scripts is not unpacked from app.asar' }
          foreach ($f in Get-ChildItem $s.DirectoryName -Filter *.ps1) {
            $out = powershell.exe -NoProfile -ExecutionPolicy Bypass -File $f.FullName -List 2>&1 | Out-String
            if ($f.Name -in 'windows-startup.ps1','windows-space.ps1','windows-volumes.ps1','windows-upgrade.ps1','windows-recover-places.ps1','windows-phone.ps1') {
              try { $null = $out.Trim() | ConvertFrom-Json } catch { throw "$($f.Name) from the installed app gave no JSON: $out" }
            }
            "$($f.Name): ok"
          }
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx tsc -p tsconfig.json
      - run: node dist/scripts/distro-check.js
      - run: brew install testdisk
      - run: node dist/scripts/recover-check.js
