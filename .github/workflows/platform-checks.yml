name: Windows and Mac checks
# Runs MendKit's own commands on real Windows and macOS machines: every PowerShell script is parsed by
# PowerShell, every Mac shell script by the Mac's /bin/sh, and the read-only commands run for real.
on:
  push:
    paths: ['definitions/**', 'src/**', '.github/workflows/platform-checks.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx tsc -p tsconfig.json
      - run: node dist/scripts/windows-check.js
      - name: Install PhotoRec the way MendKit does (winget), or from its zip if winget is missing
        shell: pwsh
        run: |
          winget install --id CGSecurity.TestDisk -e --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            Invoke-WebRequest https://www.cgsecurity.org/testdisk-7.2.win64.zip -OutFile td.zip
            Expand-Archive td.zip -DestinationPath C:\td
            "MENDKIT_PHOTOREC_DIR=$((Get-ChildItem C:\td -Directory | Select-Object -First 1).FullName)" >> $env:GITHUB_ENV
          }
      - run: node dist/scripts/recover-check.js
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx tsc -p tsconfig.json
      - run: node dist/scripts/distro-check.js
      - run: brew install testdisk
      - run: node dist/scripts/recover-check.js
