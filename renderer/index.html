<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>MendKit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="rail">
    <div class="brand">
      <svg viewBox="0 0 48 48" width="34" height="34" aria-hidden="true">
        <polygon points="24,4 41.3,14 41.3,34 24,44 6.7,34 6.7,14" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M24 24 L24 9 M24 24 L37 31.5 M24 24 L11 31.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <circle cx="24" cy="24" r="4.5" fill="#f2a93b"/>
      </svg>
      <span>MendKit</span>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <label class="switch"><input type="checkbox" id="techToggle"> Technician mode</label>
      <div id="adminBadge" class="badge"></div>
      <div id="netBadge" class="badge warn" hidden>No internet</div>
      <div id="updateBadge" class="badge update" hidden></div>
      <div id="version"></div>
    </div>
  </aside>
  <main>
    <section id="view"><p class="lead">Starting MendKit...</p></section>
    <section id="console">
      <header>
        <span id="runStatus">Ready</span>
        <div id="bar" hidden><div id="barFill"></div></div>
        <span id="pct"></span>
        <button id="cancelBtn" class="ghost" hidden>Cancel</button>
      </header>
      <ol id="stepList"></ol>
      <pre id="output"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
